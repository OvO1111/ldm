model:
  base_learning_rate: 1.e-4
  train_target: ldm.models.diffusion.ddpm.LatentDiffusion
  test_target: inference.models.InferLatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    loss_type: l1
    first_stage_key: image
    cond_stage_key: label
    conditioning_key: concat
    image_size: [64, 64, 64]  # after first-stage encoding
    channels: 4  # after first-stage encoding
    monitor: val/loss_simple_ema
    cond_stage_trainable: false

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64  # not used
        in_channels: 5
        out_channels: 4
        model_channels: 128
        attention_resolutions: []
        num_res_blocks: 2
        channel_mult: [1, 2, 4]
        num_head_channels: 32
        use_checkpoint: true  # always use ckpt

    first_stage_config:
      target: ldm.modules.diffusionmodules.model_lesiondiff.LesionDiffusionVQModelInterface
      params:
        monitor: "val/rec_loss"
        image_key: image
        embed_dim: 4
        n_embed: 2048
        dims: 3
        is_conditional: false
        ckpt_path: /ailab/public/pjlab-smarthealth03/leiwenhui/thr/code/lesionedition/vq2048/checkpoints/last.ckpt
        lossconfig:
          target: torch.nn.Identity

        ddconfig:
          double_z: False
          z_channels: 4
          resolution: [96, 96, 96]
          in_channels: 1
          out_ch: 1
          ch: 96
          ch_mult: [ 1, 1 ,1 ]  # num_down = len(ch_mult)-1 
          sample_depth: [ 0 ] # specific layer depth for up and down sampling
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
          dims: 3
          attn_type: none

    cond_stage_config: 
      target: ldm.modules.encoders.modules.ResizeConditionEncoder
      params:
        input_size: [128, 128, 128]
        output_size: [64, 64, 64]
        resize_mode: nearest

  test_only_params:
    save_dataset: true 
    save_dataset_path: /ailab/user/dailinrui/data/ldm/difftumor/${dataset_name}/dataset_v3
    suffix_keys: 
      samples: .nii.gz
      mask: .nii.gz
    ckpt_path: /ailab/user/dailinrui/data/ldm/difftumor/${dataset_name}/checkpoints/last.ckpt

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 1  # train batch size, test is default to test_batch_size=1
    num_workers: 0
    wrap: False
    train:
      target: ldm.data.difftumor.TorchioDataloader
      params:
        iter_num: null
        crop_shape: [128, 128, 128]
        dataset_name: gallbladder_tumor
    validation:
      target: ldm.data.difftumor.TorchioDataloader
      params:
        iter_num: 10
        crop_shape: [128, 128, 128]
        dataset_name: gallbladder_tumor
    test:
      target: ldm.data.difftumor.TorchioDataloader
      params:
        iter_num: null
        crop_shape: [128, 128, 128]
        dataset_name: gallbladder_tumor

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        train_batch_frequency: 200
        max_images: 10
        log_images_kwargs: 
          ddim_steps: 50
        logger:
          inputs: 
            target: image_rescale
          conditioning:
            target: image_rescale
          reconstruction:
            target: image_rescale
          samples:
            target: image_rescale

  trainer:
    benchmark: true
    max_epochs: 1000
    replace_sampler_ddp: false
    limit_test_batches: 500