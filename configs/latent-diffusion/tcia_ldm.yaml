model:
  base_learning_rate: 1.e-4
  experiment_name: tcia_ldm_64_64_64
  train_target: ldm.models.diffusion.ddpm.RiskDiffusion
  test_target: inference.models.InferLatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    loss_type: l1
    first_stage_key: image_and_seg
    cond_stage_key: survival
    conditioning_key: crossattn
    image_size: [64, 64, 64]  # after first-stage encoding
    channels: 2  # after first-stage encoding
    monitor: val/loss_simple_ema
    cond_stage_trainable: true
    score_corrector_config: 
      target: ldm.models.diffusion.ddim.FMCIBScoreCorrector
      params:
        classifier_scale: 1.
        weight_decay: 0.999
        betas: [0.1, 0.01]
        lr: 1e-2
        use_optimizer_on_classifier_scale: false

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.RiskUNetModel
      params:
        image_size: 64  # not used
        in_channels: 2
        out_channels: 2
        model_channels: 64
        attention_resolutions: []
        num_res_blocks: 2
        channel_mult: [1, 2, 4]
        num_head_channels: 32
        use_checkpoint: true  # always use ckpt
        return_latents: true
        use_spatial_transformer: true
        context_dim: 4

    first_stage_config:
      target: ldm.modules.encoders.modules.IdentityFirstStage

    cond_stage_config: 
      target: ldm.modules.encoders.modules.LinearEmbedder
      params:
        in_channels: 1
        model_channels: 4
        ch_mult: [1, 1]

  test_only_params:
    save_dataset: true 
    save_dataset_path: /ailab/user/dailinrui/data/ldm/tcia_risk_v1/dataset
    suffix_keys: 
      samples: .nii.gz
      mask: .nii.gz
    ckpt_path: /ailab/user/dailinrui/data/ldm/tcia_risk_v1/checkpoints/last.ckpt

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 4  # train batch size, test is default to test_batch_size=1
    num_workers: 8
    wrap: False
    train:
      target: ldm.data.tcia.TCIA
      params:
        split: train
        max_size: null
        use_datasets: null
        tcia_transform_config: 
          resize_or_crop: crop
          output_size: [64, 64, 64]
    validation:
      target: ldm.data.tcia.TCIA
      params:
        split: val
        max_size: null
        use_datasets: null
        tcia_transform_config: 
          resize_or_crop: crop
          output_size: [64, 64, 64]
    test:
      target: ldm.data.tcia.TCIA
      params:
        split: val
        max_size: null
        use_datasets: null
        tcia_transform_config: 
          resize_or_crop: crop
          output_size: [64, 64, 64]

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        train_batch_frequency: 200
        max_images: 10
        log_images_kwargs: 
          ddim_steps: 50
        logger:
          inputs: 
            target: image_rescale
          samples:
            target: image_rescale

  trainer:
    benchmark: true
    max_epochs: 1000
    replace_sampler_ddp: false
    limit_test_batches: 500